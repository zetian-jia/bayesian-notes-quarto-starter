project:
  type: book
  output-dir: docs

book:
  title: "贝叶斯数据分析笔记"
  subtitle: "跟着 Q1–Q5 框架读《贝叶斯数据分析——基于R与Python的实现》"
  author: "贾泽天"
  date: today
  repo-url: https://zetian-jia.github.io/bayesian-notes-quarto-starter/
  repo-actions: [edit, issue]
  page-footer:
    left: "笔记基于吴喜之《贝叶斯数据分析》整理"
    right: "本站由 Quarto 构建"
  chapters:
    - index.qmd
    - part: "第一部分：基础篇"
      chapters:
        - chapters/01-intro.qmd
        - chapters/02-basic-concepts.qmd
    - part: "第二部分：初等贝叶斯模型"
      chapters:
        - chapters/04-bernoulli.qmd
        - chapters/05-normal.qmd
    - part: "第三部分：算法与概率编程"
      chapters:
        - chapters/07-mcmc-algorithms.qmd
        - chapters/08-stan-pymc.qmd
    - part: "第四部分：更多的贝叶斯模型"
      chapters:
        - chapters/10-lm-bayes.qmd
        - chapters/13-bayes-net.qmd
        - chapters/14-HMM.qmd
  page-navigation: true
  search: true
  sidebar:
    style: "docked"
    background: light

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-tools: true
    highlight-style: github

execute:
  freeze: auto  # 没改动的章节不重新跑代码，加速渲染
